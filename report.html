<title>鼎兆元調撥系統 — 會計專區</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f8; --panel:#fff; --head:#e9edf3; --line:#e2e8f0; --ink:#28323e; --dim:#7c8b9d;
  --accent:#3a72b5; --accent-soft:rgba(58,114,181,.10); --brand:#d2542f;
  --done:#4a9e78; --danger:#c9615f; --shadow:0 1px 2px rgba(30,45,65,.04),0 5px 16px rgba(30,45,65,.045);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:28px 20px 80px;
     font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto}
/* 標題區給一層底色：一悟的 logo 是白底，放在純白／太淺的底上會整塊消失 */
header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;
       background:var(--head);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.logos{display:flex;align-items:center;gap:9px}
/* 不加白底、不留 padding、不畫框（Eason 2026-07-29：外框不要有白邊）；cover 裁滿避免 contain 露底色縫 */
.logos img{height:34px;width:34px;object-fit:cover;display:block;border-radius:8px}
h1{font-size:19px;margin:0;letter-spacing:.03em}
h1 b{color:var(--dim);font-weight:400;margin:0 -1px}
header p{margin:0;color:var(--dim);font-size:13px}
.back{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;
      border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--panel)}
.back:hover{background:var(--accent-soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
h2{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin:0 0 16px}
h3{font-size:14px;margin:22px 0 10px}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
input,select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
/* 下載按鈕列：按鈕照自己的寬度排，不套 .row 的 min-width——
   之前用 .row＋flex:0 包按鈕，包框被壓成 150px 但按鈕本體 258px，
   溢出去疊到隔壁的「明細 CSV」（2026-07-29 Eason 實際看到重疊） */
.btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 18px;
       background:var(--accent);color:#fff;font-weight:600;white-space:nowrap}
button.line{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
button.sm{padding:5px 11px;font-size:13px;font-weight:500}
button:disabled{opacity:.45;cursor:default}
.msg{border-radius:10px;padding:11px 14px;font-size:14px;margin:14px 0 0;display:none}
.msg.ok{display:block;background:rgba(46,168,106,.12);border:1px solid var(--done);color:var(--done)}
.msg.err{display:block;background:rgba(214,69,69,.12);border:1px solid var(--danger);color:var(--danger)}
.scroll{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--bg);color:var(--dim);font-weight:600;font-size:12px;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;background:var(--accent-soft)}
.gap{color:var(--danger);font-weight:600}
/* 調撥矩陣 */
.mtx th.rowh{text-align:left;background:var(--bg);position:sticky;left:0;z-index:1;font-weight:600;color:var(--ink)}
.mtx td.mx b{display:block;font-weight:700}
.mtx td.mx i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:1px}
.mtx td.mx{background:var(--accent-soft)}
.mtx td.mx0{color:var(--line)}
.mtx td.mx a{color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:700}
/* 矩陣格子的彈出視窗（Eason 2026-07-31：點金額看各類別金額） */
.pop{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:center;
     justify-content:center;padding:20px;z-index:50}
.pop.hide{display:none}
.pop .box{background:var(--panel);border-radius:16px;padding:20px;max-width:360px;width:100%;
          box-shadow:0 12px 40px rgba(20,30,45,.25)}
.pop h4{margin:0 0 4px;font-size:16px}
.pop .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.pop dl{display:grid;grid-template-columns:1fr auto;gap:9px 12px;margin:0 0 16px;font-size:15px}
.pop dt{color:var(--dim)}
.pop dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pop dl .ln{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
a.flow{color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:600}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.65}
.hide{display:none}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--bg);
     border:1px solid var(--line);color:var(--dim);margin-left:6px}
.off{opacity:.5}
</style>

  </header>

  <!-- 密碼 -->
  <div class="card" id="gate">
    <h2>會計專區密碼</h2>
    <div class="row">
      <div><label>密碼</label><input id="pin" type="password" placeholder="請輸入密碼" autocomplete="current-password"></div>
      <div style="flex:0"><button id="unlock">進入</button></div>
    </div>
    <div class="msg" id="gmsg"></div>
    <p class="note">如忘記密碼，請洽詢 EASON。</p>
  </div>

  <!-- 月報 -->
  <div class="card hide" id="rptCard">
    <h2>月報（給會計對帳）</h2>
    <div class="row">
      <div><label>年月</label><input id="ym" type="month"></div>
      <div><label>門市（可不選＝全部）</label><select id="node"></select></div>
      <div style="flex:0"><button id="gen">產生月報</button></div>
    </div>
    <div class="msg" id="rmsg"></div>
    <div id="rpt"></div>
  </div>

  <!-- 矩陣金額的彈出視窗 -->
  <div class="pop hide" id="pop"><div class="box" id="popBox"></div></div>

  <!-- 管理 -->
  <div class="card hide" id="admCard">
    <h2>資料整理</h2>

    <!-- 差異原因清單 2026-07-31 移除（Eason）：改名／停用／合併走試算表「差異原因」分頁 -->

    <h3>品項記憶</h3>
    <!-- 品項記憶全部門市共用（Eason 2026-07-31），所以沒有品牌欄也沒有品牌篩選 -->
    <div class="scroll"><table id="mtab"></table></div>
    <p class="note">全部門市共用同一份清單，任何一店開單都會用到、也會更新它。
    名稱／規格／單位可以直接改，改完按該列的「儲存」；刪掉只是不再自動帶出來，已經開過的單不受影響。</p>
    <div class="msg" id="amsg"></div>
  </div>
</div>

<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbxRqci1Cnu92TKoAfYIpDxDfxjGF3_ENrjQL1yurnkxOwZz9MyM9Eu9grIcdeKjbs8-/exec';
let PIN = '', NODES = [], RPT = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n2 = (v) => v === '' || v === null || v === undefined ? '' : Number(v).toLocaleString('zh-TW');

async function post(action, payload) {
  const body = JSON.stringify({ action, payload });
  if (window.__LOCAL_BACKEND__) return JSON.parse(window.__LOCAL_BACKEND__(body));
  const r = await fetch(API, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body
  });
  return r.json();
}
function show(el, kind, text) { el.className = 'msg ' + kind; el.textContent = text; }

// ── 進入 ──────────────────────────────────────────────
$('unlock').onclick = async () => {
  const pin = $('pin').value.trim();
  const res = await post('adminData', { pin_master: pin });
  if (!res.ok) return show($('gmsg'), 'err', res.error);
  PIN = pin;
  $('gate').classList.add('hide');
  $('rptCard').classList.remove('hide');
  $('admCard').classList.remove('hide');
  paintAdmin(res.data);
};
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('unlock').click(); });

// ── 月報 ──────────────────────────────────────────────
$('gen').onclick = async () => {
  const ym = $('ym').value;
  if (!ym) return show($('rmsg'), 'err', '請先選年月');
  show($('rmsg'), '', '');
  const res = await post('buildMonthlyReport', { ym: ym, node: $('node').value, pin_master: PIN });
  if (!res.ok) return show($('rmsg'), 'err', res.error);
  RPT = res.data;
  paintReport();
  show($('rmsg'), 'ok', `已產生 ${res.data.sheets.join('、')}（同一個月重跑會覆蓋，不會愈長愈多張）`);
};

/** 靠欄位名判斷哪幾欄是數字，不要靠欄位位置——欄位一改順序就會把「有無差異」算成 NaN */
const isNum = (h) => /單數|總額|淨額|品項數/.test(h);

function tableHtml(headers, rows, totalLast, nodes) {
  const th = headers.map((h) => `<th class="${isNum(h) ? 'n' : ''}">${esc(h)}</th>`).join('');
  const tr = rows.map((r, ri) => {
    const isTotal = totalLast && ri === rows.length - 1;
    const node = nodes ? nodes[ri] : null;
    const tds = r.map((v, i) => {
      const num = isNum(headers[i]);
      const bad = num && headers[i].indexOf('差異') >= 0 && Number(v);
      // 只有調出總額做成連結，點了看這店調給了哪幾家、各多少錢（單數不做，同一列兩個連結太吵）
      const linkable = node && Number(v) && headers[i] === '調出總額';
      const body = num ? n2(v) : esc(v);
      const cell = linkable ? `<a class="flow" data-node="${esc(node)}">${body}</a>` : body;
      return `<td class="${num ? 'n' : ''}${bad ? ' gap' : ''}">${cell}</td>`;
    }).join('');
    return `<tr class="${isTotal ? 'total' : ''}">${tds}</tr>`;
  }).join('');
  return `<thead><tr>${th}</tr></thead><tbody>${tr}</tbody>`;
}

/**
 * 調撥矩陣：列＝調出門市，欄＝調入門市，格子＝金額（小字是張數）
 * 這是「一眼看完這個月誰調給誰、多少錢」最省事的形式——沒有往來的格子留白，
 * 有往來的自然凸出來，會計不用逐店點開看。
 */
function matrixHtml() {
  const nodes = RPT.summary.nodes || [];
  const flows = RPT.flows || {};
  // 調入方**不能只從 nodes 裡挑**：篩選單一門市時 nodes 只有那一家，
  // 調給別家的欄位會全被濾掉，矩陣看起來像沒資料（Eason 2026-07-31 回報）。
  // 節點的標準順序用 shorts 的鍵（後端照 NODE_LIST 順序給），沒有就退回 nodes。
  const allNodes = Object.keys(RPT.shorts || {});
  const order = allNodes.length ? allNodes : nodes;
  const label = (n) => {
    const i = nodes.indexOf(n);
    if (i >= 0) return RPT.summary.rows[i][0] + ' ' + RPT.summary.rows[i][1];
    return (RPT.shorts || {})[n] || n;   // 不在彙總裡（被篩掉的對手店）就用簡稱
  };
  const srcs = order.filter((n) => (flows[n] || []).length);
  if (!srcs.length) return '<h3>調撥矩陣</h3><p class="note">這個月沒有調撥紀錄。</p>';

  // 只列出真的有收到貨的門市，欄位才不會一整片空的
  const dstSet = new Set();
  srcs.forEach((s) => flows[s].forEach((d) => dstSet.add(d.node)));
  const dsts = order.filter((n) => dstSet.has(n));
  const shortOf = (n) => {
    for (const s of srcs) { const hit = flows[s].find((d) => d.node === n); if (hit) return hit.short; }
    return (RPT.shorts || {})[n] || n;
  };

  const head = `<tr><th>調出 ＼ 調入</th>${dsts.map((d) => `<th class="n">${esc(shortOf(d))}</th>`).join('')}<th class="n">合計</th></tr>`;
  const colTot = {}, rows = srcs.map((s) => {
    let rowTot = 0;
    const tds = dsts.map((d) => {
      const hit = flows[s].find((x) => x.node === d);
      if (!hit) return '<td class="n mx0">—</td>';
      rowTot += hit.amount;
      colTot[d] = (colTot[d] || 0) + hit.amount;
      // 金額做成連結：點了彈出視窗看食材／包材各多少（Eason 2026-07-31）
      return `<td class="n mx"><b><a class="cell" data-from="${esc(s)}" data-to="${esc(d)}">${n2(hit.amount)}</a></b><i>${hit.docs} 張</i></td>`;
    }).join('');
    return `<tr><th class="rowh">${esc(label(s))}</th>${tds}<td class="n"><b>${n2(rowTot)}</b></td></tr>`;
  }).join('');
  const grand = dsts.reduce((a, d) => a + (colTot[d] || 0), 0);
  const foot = `<tr class="total"><th class="rowh">合計</th>${dsts.map((d) =>
    `<td class="n">${n2(colTot[d] || 0)}</td>`).join('')}<td class="n">${n2(grand)}</td></tr>`;

  return `<h3>調撥矩陣（${esc(RPT.ym)}　誰調給誰）</h3>
    <div class="scroll"><table class="mtx"><thead>${head}</thead><tbody>${rows}${foot}</tbody></table></div>
    <p class="note">橫的看是「這一店調出去給了誰」，直的看是「這一店收到誰的貨」。格子上面是金額、下面是張數，沒往來就留「—」。
    <b>點金額</b>會跳出這一格的各類別各多少錢。</p>`;
}

/**
 * 點矩陣格子的金額 → 彈出視窗，拆這一格的各類別金額（Eason 2026-07-31）。
 * food／pack 由後端 flows 帶來（舊後端沒有就顯示「這版後端沒有拆帳」，不要算出假數字）。
 */
function showCell(from, to) {
  const hit = ((RPT.flows || {})[from] || []).find((x) => x.node === to);
  if (!hit) return;
  const nameOf = (n) => {
    const i = (RPT.summary.nodes || []).indexOf(n);
    return i >= 0 ? RPT.summary.rows[i].slice(0, 2).join(' ') : n;
  };
  // 類別由後端給（RPT.itemCats／hit.cats）——前端不寫死類別名稱，
  // 這樣以後加第四類（雜貨就是 2026-07-31 這樣加的）前端一行都不用改
  const cats = hit.cats || null;
  const names = RPT.itemCats || (cats ? Object.keys(cats) : []);
  const sum = cats ? names.reduce((a, c) => a + (cats[c] || 0), 0) : 0;
  const other = cats ? Math.round((hit.amount - sum) * 100) / 100 : 0;

// ── 產生真正的 .xlsx（多分頁）──────────────────────────
// CSV 沒有「分頁」這種東西，要每個品牌一個分頁只能產 xlsx。
// xlsx＝一包 zip 裡的幾個 XML，這裡用「不壓縮（store）」的 zip 自己組，不依賴任何外部套件。
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  const u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const u16 = (v) => [v & 255, (v >>> 8) & 255];

  files.forEach((f) => {
    const name = enc.encode(f.name);
    const data = enc.encode(f.text);
    const crc = crc32(data);
    const local = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(dosTime), ...u16(dosDate), ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0)]);
    chunks.push(local, name, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(dosTime), ...u16(dosDate), ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]),
      name);
    offset += local.length + name.length + data.length;
  });

  const cdStart = offset;
  let cdSize = 0;
  central.forEach((c) => { cdSize += c.length; });
  const eocd = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(cdStart), ...u16(0)]);

  const all = chunks.concat(central, [eocd]);
  let total = 0;
  all.forEach((a) => { total += a.length; });
  const out = new Uint8Array(total);
  let pos = 0;
  all.forEach((a) => { out.set(a, pos); pos += a.length; });
  return out;
}
const xe = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function colRef(i) {
  let s = '';
  i += 1;
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; }
  return s;
}
function sheetXml(headers, rows) {
  const all = [headers].concat(rows);
  const body = all.map((r, ri) => {
    const cells = r.map((v, ci) => {
      const ref = colRef(ci) + (ri + 1);
      const numeric = typeof v === 'number' || (v !== '' && v !== null && v !== undefined && !isNaN(v) && String(v).trim() !== '');
      return (ri > 0 && numeric)
        ? `<c r="${ref}"><v>${Number(v)}</v></c>`
        : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(sheets) {
  const files = [];
  files.push({
    name: '[Content_Types].xml',
    text: `<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet"/>`).join('')}</Types>`
  });
  files.push({
    name: '_rels/.rels',
    text: `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`
  });
  files.push({
    name: 'xl/workbook.xml',
    text: `<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xe(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`
  });
  files.push({
    name: 'xl/_rels/workbook.xml.rels',
    text: `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}</Relationships>`
  });
  sheets.forEach((s, i) => {
    files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, text: sheetXml(s.headers, s.rows) });
  });
  return zipStore(files);
}

/**
 * 月報 xlsx：彙總 ＋ 全部明細 ＋ 每個品牌一張分頁
 * 「全部明細」＝**一列一個品項**（Eason 2026-07-31 指定欄位：單號／狀態／調撥日期／
 * 調出門市簡稱／調入門市簡稱／打包人／簽收人／品項名稱／類別／規格／單位／單價／數量／小計）。
 * 品牌分頁同一份資料，只留「調出或調入其中一方是這個品牌」的列。
 * 舊後端沒有 items 時退回逐張單的明細，Excel 照樣下載得到。
 */
function reportSheets() {
  const D = RPT.items || RPT.detail;
  const H = D.headers;
  // 靠欄位名找品牌，不靠位置（欄位順序改過就錯的老坑）
  const iOut = H.indexOf('調出門市'), iIn = H.indexOf('調入門市');
  const brands = ['墨竹亭', '一悟燒肉', '小辛辣', '鼎兆元總部'];
  // 門市欄是簡稱（墨·金山），品牌要靠簡稱前綴對回去；央廚沒有前綴，自己一組
  const prefix = { '墨竹亭': '墨·', '一悟燒肉': '悟·', '小辛辣': '辣·' };
  const sheets = [
    { name: '彙總', headers: RPT.summary.headers, rows: RPT.summary.expanded },
    { name: '全部明細', headers: H, rows: D.rows }
  ];
  brands.forEach((b) => {
    const belongs = (v) => b === '鼎兆元總部' ? String(v) === '中央廚房'
      : String(v).indexOf(prefix[b]) === 0;
    const rows = D.rows.filter((r) => belongs(r[iOut]) || belongs(r[iIn]));
    sheets.push({ name: b, headers: H, rows: rows });
  });
  return sheets;
}

function downloadXlsx() {
  const bytes = buildXlsx(reportSheets());
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = `調撥月報_${RPT.ym}.xlsx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── 管理 ──────────────────────────────────────────────
let ADM = null;
function paintAdmin(data) {
  ADM = data;
  paintMem();
}

function paintMem() {
  const list = ADM.items;   // 共用一份，沒有品牌可篩
  // 名稱／規格／單位做成可編輯的欄位（Eason 2026-07-31）；最近單價與用過幾次是系統累積的，只顯示不給改
  $('mtab').innerHTML = `<thead><tr><th>品項</th><th>規格</th><th>單位</th><th class="n">最近單價</th><th class="n">用過幾次</th><th></th></tr></thead>
    <tbody>${list.length ? list.map((i, k) => `<tr>
      <td><input class="me-name" data-k="${k}" value="${esc(i.name)}" style="min-width:120px"></td>
      <td><input class="me-spec" data-k="${k}" value="${esc(i.spec)}" style="min-width:90px"></td>
      <td><input class="me-unit" data-k="${k}" value="${esc(i.unit)}" style="min-width:70px"></td>
      <td class="n">${n2(i.price)}</td><td class="n">${i.uses}</td>
      <td style="white-space:nowrap">
        <button class="sm line msave" data-k="${k}">儲存</button>
        <button class="sm line mdel" data-k="${k}">刪除</button></td>
    </tr>`).join('') : '<tr><td colspan="6">還沒有品項記憶</td></tr>'}</tbody>`;

  const rowOf = (b) => list[Number(b.dataset.k)];
  const val = (cls, k) => $('mtab').querySelector(`.${cls}[data-k="${k}"]`).value.trim();

  $('mtab').querySelectorAll('.msave').forEach((b) => {
    b.onclick = () => {
      const i = rowOf(b), k = b.dataset.k;
      const newName = val('me-name', k), spec = val('me-spec', k), unit = val('me-unit', k);
      if (!newName) return show($('amsg'), 'err', '品項名稱不能空白。');
      // 沒改就不要白跑一趟後端
      if (newName === i.name && spec === i.spec && unit === i.unit) {
        return show($('amsg'), 'ok', '沒有改到任何東西。');
      }
      b.disabled = true;                      // 後端一趟一兩秒，先鎖住免得連按
      const old = b.textContent; b.textContent = '儲存中…';
      adm({ op: 'memoryEdit', name: i.name, newName: newName, spec: spec, unit: unit },
        '已更新，舊單不受影響（記憶只是下次開單的自動帶入來源）',
        () => { b.disabled = false; b.textContent = old; })
        .then((res) => {
          // 被擋下來（例如撞名）時把欄位還原成後端的真實值——留著沒存進去的字
          // 會看起來像已經改好了，甚至像有兩筆同名（成功時整張表會重畫，不用還原）
          if (res && res.ok) return;
          const row = $('mtab');
          if (!row) return;
          const nEl = row.querySelector(`.me-name[data-k="${k}"]`);
          const sEl = row.querySelector(`.me-spec[data-k="${k}"]`);
          const uEl = row.querySelector(`.me-unit[data-k="${k}"]`);
          if (nEl) nEl.value = i.name;
          if (sEl) sEl.value = i.spec;
          if (uEl) uEl.value = i.unit;
        });
    };
  });

  $('mtab').querySelectorAll('.mdel').forEach((b) => {
    b.onclick = () => {
      const i = rowOf(b);
      if (!confirm(`刪掉「${i.name}」的記憶？舊單不受影響。`)) return;
      adm({ op: 'memoryDelete', name: i.name }, '已刪除');
    };
  });
}

// bindAdmin 隨差異原因清單一起移除（2026-07-31）

/** done：成功或失敗都會呼叫（用來解鎖按鈕），別放只有成功才該做的事 */
async function adm(payload, okText, done) {
  let res;
  try {
    res = await post('adminUpdate', Object.assign({ pin_master: PIN }, payload));
  } catch (err) {
    if (done) done();
    show($('amsg'), 'err', '送不出去，可能是沒有網路，等一下再按一次。');
    return { ok: false };
  }
  if (done) done();
  if (!res.ok) { show($('amsg'), 'err', res.error); return res; }
  const d = await post('adminData', { pin_master: PIN });
  if (d.ok) paintAdmin(d.data);
  show($('amsg'), 'ok', okText + (res.data && res.data.moved ? `（搬了 ${res.data.moved} 筆明細）` : ''));
  return res;
}
